# Broker na serwerze: kazde polaczenie z loginem, uprawnienia z pliku acl.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Pamiec wiadomosci z flaga retain (status, config) przez restart brokera.
persistence true
persistence_location /mosquitto/data/

# Wewnetrzny, bez TLS - tylko siec Dockera (Telegraf). Port nie jest
# wystawiony w docker-compose.yml.
listener 1883

# Robot. Certyfikat kopiuje tu renew-certs.sh z danych Caddy'ego.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Panel w przegladarce, przez Caddy (/mqtt). TLS konczy sie w Caddym.
listener 9001
protocol websockets
