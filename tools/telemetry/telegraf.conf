# Telegraf: telemetria robota z MQTT do InfluxDB.
#
# Temat flora/<robot>/<zrodlo>/<nazwa> staje sie:
#   measurement = <nazwa>   (power, soil, attitude, ...)
#   tagi        = robot, source (tele = bryla, head = glowica)
# Pola to klucze JSON-a. Tablice rozwijaja sie na pola z indeksem
# (temp: c_0, c_1; sun: lux_0..lux_3).

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["${MQTT_SERVER}"]
  # Bez status, ack, cmd i config - to nie sa szeregi czasowe.
  topics = ["flora/+/tele/#", "flora/+/head/#"]
  qos = 0
  client_id = "telegraf-flora"
  # Puste lokalnie (broker bez hasel), ustawiane na serwerze.
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  # Pelny temat jako tag tylko by dublowal measurement i tagi z topic_parsing.
  topic_tag = ""
  data_format = "json"

  # Parser json domyslnie ODRZUCA true/false i teksty. Pola z tej listy
  # zostaja: true/false jako wartosci logiczne, teksty jako tekst
  # (sprawdzone na 1.32.2). Lista dziala po nazwie pola, dlatego nazwy
  # takich pol w firmware sa unikalne (patrz hub/main/hub_telemetry.c).
  json_string_fields = ["stall", "last", "running", "present", "pin",
                        "valid", "on", "up", "camera_ok",
                        # tele/boot
                        "fw", "built", "idf", "reset",
                        # tele/log
                        "lvl", "tag", "msg"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "flora/+/+/+"
    measurement = "_/_/_/measurement"
    tags = "_/robot/source/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "flora"
  bucket = "flora"
