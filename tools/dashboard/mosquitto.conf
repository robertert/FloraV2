# Broker do debugowania robota. Tylko do sieci lokalnej - bez hasel.
#
#   mosquitto -c tools/dashboard/mosquitto.conf -v
#
# 1883: zwykle MQTT, tu laczy sie bryla (FLORA_MQTT_URI_DEFAULT / NVS mqtt_uri)
# 9001: MQTT po WebSocket, tu laczy sie panel w przegladarce
#
# Od mosquitto 2.0 bez "listener" broker slucha tylko na localhost,
# wiec robot w sieci by sie nie polaczyl.

listener 1883 0.0.0.0
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
